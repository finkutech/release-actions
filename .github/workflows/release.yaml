name: Release Management

on:
  workflow_call:
    inputs:
      staging-branch:
        description: "Name of the staging branch"
        required: false
        type: string
        default: "staging"
      main-branch:
        description: "Name of the main/production branch"
        required: false
        type: string
        default: "main"
      jira-base-url:
        description: "JIRA browse base URL for ticket linking"
        required: false
        type: string
        default: "https://finkutech.atlassian.net/browse"
      ticket-pattern:
        description: "Case-insensitive regex for ticket keys, matched on the branch name, then the PR title"
        required: false
        type: string
        default: '\bREV-[0-9]+'
    secrets:
      slack-webhook-url:
        description: "Slack Incoming Webhook URL for release notifications"
        required: false

jobs:
  # Any base except main, so stacked PRs (base = another feature branch) are announced too.
  notify-pr-opened:
    if: >-
      github.event.action == 'opened'
      && github.event.pull_request.base.ref != inputs.main-branch
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Notify Slack for review
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          JIRA_BASE_URL: ${{ inputs.jira-base-url }}
          TICKET_PATTERN: ${{ inputs.ticket-pattern }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No Slack webhook configured, skipping notification"
            exit 0
          fi

          TICKET=$(printf '%s\n%s\n' "$PR_BRANCH" "$PR_TITLE" | grep -oiE "$TICKET_PATTERN" | head -1 | tr '[:lower:]' '[:upper:]')
          if [ -n "$TICKET" ]; then
            TICKET_TEXT=" | <${JIRA_BASE_URL}/${TICKET}|${TICKET}>"
          else
            TICKET_TEXT=""
          fi

          # Slack mrkdwn treats &, <, > as control characters inside links.
          TITLE=$(printf '%s' "$PR_TITLE" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

          REVIEWERS="<@U050ZKVN022> <@U058JKUUY8K> <@U05D5MQEDGC>"
          TEXT=":eyes: *Review requested* — <${PR_URL}|#${PR_NUM} ${TITLE}>
          :bust_in_silhouette: ${PR_AUTHOR} → \`${PR_BRANCH}\` → \`${PR_BASE}\`${TICKET_TEXT}
          :bellhop_bell: ${REVIEWERS}"

          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sSf -X POST "$SLACK_WEBHOOK_URL" -H 'Content-type: application/json' -d @-

  # Rebuilds the whole changes table on every staging merge from the PRs whose commits are in
  # main..staging, so PRs merged into a stack parent get their own row.
  manage-release-pr:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == inputs.staging-branch
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr-management
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version string
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE_TAG=$(date -u +"%Y.%m.%d")
          EXISTING=$(gh api repos/${{ github.repository }}/tags \
            --paginate --jq '.[].name' | grep "^v${DATE_TAG}\." | sort -t. -k4 -n | tail -1)
          if [ -z "$EXISTING" ]; then
            SEQ=1
          else
            LAST_SEQ=$(echo "$EXISTING" | rev | cut -d. -f1 | rev)
            SEQ=$((LAST_SEQ + 1))
          fi
          VERSION="v${DATE_TAG}.${SEQ}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check for existing release PR
        id: check_pr
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_BRANCH: ${{ inputs.main-branch }}
          STAGING_BRANCH: ${{ inputs.staging-branch }}
        run: |
          EXISTING_PR=$(gh pr list \
            --base "$MAIN_BRANCH" \
            --head "$STAGING_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$EXISTING_PR" ] || [ "$EXISTING_PR" = "null" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${EXISTING_PR}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release PR
        id: create_pr
        if: steps.check_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          MAIN_BRANCH: ${{ inputs.main-branch }}
          STAGING_BRANCH: ${{ inputs.staging-branch }}
        run: |
          PR_URL=$(gh pr create \
            --base "$MAIN_BRANCH" \
            --head "$STAGING_BRANCH" \
            --title "release: ${VERSION}" \
            --body "$(cat <<EOF
          ## Release ${VERSION}

          ### Changes in this release

          <!-- RELEASE_CHANGES_START -->
          <!-- RELEASE_CHANGES_END -->

          ### Release checklist
          - [ ] Verified changes on staging
          - [ ] Reviewed release notes above
          EOF
          )")
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Rebuild changes table
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.check_pr.outputs.pr_number || steps.create_pr.outputs.pr_number }}
          MAIN_BRANCH: ${{ inputs.main-branch }}
          STAGING_BRANCH: ${{ inputs.staging-branch }}
          JIRA_BASE_URL: ${{ inputs.jira-base-url }}
          TICKET_PATTERN: ${{ inputs.ticket-pattern }}
        run: |
          set -o pipefail
          git fetch -q origin "$MAIN_BRANCH" "$STAGING_BRANCH"
          git rev-list "origin/${MAIN_BRANCH}..origin/${STAGING_BRANCH}" > /tmp/shas.txt

          # A PR is in the release when its head or merge commit is in main..staging. Back-merges
          # and release PRs are excluded by branch. Only the 200 most recently created merged PRs are scanned.
          gh pr list --state merged --limit 200 \
            --json number,title,author,headRefName,baseRefName,mergedAt,mergeCommit,headRefOid \
          | jq -r \
            --rawfile shas /tmp/shas.txt \
            --arg main "$MAIN_BRANCH" \
            --arg staging "$STAGING_BRANCH" \
            --arg jira "$JIRA_BASE_URL" \
            --arg pattern "$TICKET_PATTERN" '
              ($shas | split("\n") | map(select(length > 0) | {key: ., value: true}) | from_entries) as $in
              | map(select(
                  .baseRefName != $main and .headRefName != $main and .headRefName != $staging
                  and ($in[.headRefOid] or $in[.mergeCommit.oid // ""])))
              | sort_by(.mergedAt)
              | .[]
              | ([.headRefName, .title] | map([match($pattern; "i").string][0]) | map(select(. != null)) | first) as $t
              | "| #\(.number) | \(.title | gsub("\\|"; "\\|")) | @\(.author.login) | `\(.headRefName)` | "
                + (if $t then "[\($t | ascii_upcase)](\($jira)/\($t | ascii_upcase))" else "-" end)
                + " | \(.mergedAt[0:16] | sub("T"; " ")) UTC |"
            ' > /tmp/rows.md

          gh pr view "$PR_NUMBER" --json body --jq '.body' > /tmp/body.md

          python3 - <<'PY'
          start, end = "<!-- RELEASE_CHANGES_START -->", "<!-- RELEASE_CHANGES_END -->"
          body = open("/tmp/body.md").read()
          rows = open("/tmp/rows.md").read()
          if start not in body or end not in body:
              raise SystemExit(f"::error::Release PR body is missing {start} / {end}")
          table = "| PR | Title | Author | Branch | Ticket | Merged |\n|---|---|---|---|---|---|\n" + rows
          head, rest = body.split(start, 1)
          tail = rest.split(end, 1)[1]
          open("/tmp/body.md", "w").write(f"{head}{start}\n{table}{end}{tail}")
          PY

          gh pr edit "$PR_NUMBER" --body-file /tmp/body.md

  tag-release:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == inputs.main-branch
      && github.event.pull_request.head.ref == inputs.staging-branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from PR title
        id: version
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          VERSION=$(echo "$PR_TITLE" | grep -oP 'v\d{4}\.\d{2}\.\d{2}\.\d+')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from PR title: ${PR_TITLE}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

          BODY=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json body --jq '.body')

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$BODY"

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.slack-webhook-url }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No Slack webhook configured, skipping notification"
            exit 0
          fi

          REPO="${{ github.repository }}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${VERSION}"

          REVIEWERS="<@U050ZKVN022> <@U058JKUUY8K> <@U05D5MQEDGC>"
          TEXT=":white_check_mark: *${REPO} released ${VERSION}*\n\n:link: <${RELEASE_URL}|View release notes>\n:ship: Production deploy triggered\n\ncc ${REVIEWERS}"

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"${TEXT}\"}"
